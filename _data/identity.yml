    summary: |
      CSDN 博主页：https://blog.csdn.net/m0_47867419 ，昵称同样是「果壳小旋子」。码龄约 6 年（约 2020 年加入）。

      这里主要写技术向长文：机器学习、计算机视觉、深度学习里的经典结构与论文笔记，以及 Kaggle 比赛的赛题拆解和方案复盘。公开主页兴趣领域偏人工智能、计算机视觉、深度学习、神经网络；专栏里能看到「机器学习」「图像融合」「Restormer」等系列。

      近期更新里，Kaggle / NeurIPS 相关赛题分析比较多，例如行星数据挑战、高分子预测、传感器行为识别、细菌鞭毛马达定位、地震波形反演、Drawing with LLMs 等。也会写更基础的原理文，比如 Layer Normalization、Transformer 自注意力、扩散模型（DDPM）入门与代码赏析，以及多模态融合方向的论文笔记。

      公开资料显示目前就职于博世苏州；个人简介是「努力的小旋子，幸运的小旋子」。
